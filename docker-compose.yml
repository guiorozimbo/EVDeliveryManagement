version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ev_delivery_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ev_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ev_delivery_secure_pass_2026}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ev_admin} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ev-delivery-network

volumes:
  postgres_data:
    driver: local

networks:
  ev-delivery-network:
    driver: bridge
